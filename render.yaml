# render.yaml – Declarative Render deployment configuration
# Place this file at the root of your Git repository.

services:
  - type: web
    name: academic-agent
    env: python
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r academic_agent/requirements.txt
    startCommand: >-
      streamlit run academic_agent/app.py
        --server.port $PORT
        --server.enableCORS false
        --server.headless true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_STEPS
        value: "5"
      - key: USE_DENSE
        value: "false"
      - key: LLM_MAX_RETRIES
        value: "2"
    autoDeploy: true
    healthCheckPath: "/"
